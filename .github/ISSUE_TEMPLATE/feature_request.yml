name: '✨ Feature Request'
description: '새로운 기능을 제안하려면 이 템플릿을 사용하세요.'
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        ## 📄 Request

        <!-- ex) Header 구현, 특정 문제 발견, 의문점 -->
        ===

  - type: textarea
    id: request-description
    attributes:
      label: '요청할 기능 설명'
      description: '요청하는 기능 또는 개선 사항을 설명해주세요.'
      placeholder: '예: 특정 버튼의 스타일 변경, API 추가 요청 등'
    validations:
      required: true
